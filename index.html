<style>

</style></head><body>
<header><div class="hw"><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M7 11h10M4 15c0 4 4 6 8 6s8-2 8-6"/></svg></div><div><h1>TS RAHMAN</h1><div class="sub"><i>AI by Shafeeq</i></div></div><div class="sp"></div><button class="ib" id="gear" hidden>⚙ Settings</button></div></header>
<main>
<section class="screen on card" id="s-up"><h2>Upload your study material</h2><p class="m">Upload a PDF textbook or notes. Questions are generated from your document.</p>
<div class="drop" id="drop"><div style="font-size:40px">📘</div><p class="m">Drag a PDF here, or</p><button class="btn big" id="upb">Upload PDF</button><input type="file" id="file" accept="application/pdf" hidden></div>
<div class="fn" id="fn"><b id="fname"></b> <span class="m" id="fst"></span><div class="bar" style="margin-top:8px"><i id="fbar"></i></div></div><div class="err" id="uerr"></div></section>

<section class="screen card" id="s-set"><h2>Quiz settings</h2><p class="m" id="dinfo"></p>
<label class="t">Number of questions</label><div class="pills" id="gn"></div><input type="number" id="cn" min="1" max="100" placeholder="Custom (1–100)" style="margin-top:10px">
<label class="t">Difficulty</label><div class="pills" id="gd"></div>
<label class="t">Question type</label><span class="chip">Multiple choice · one correct answer</span>

<section class="screen card" id="s-load"><div class="load"><div class="ship">🚢</div><h2 id="lt">Analyzing your PDF…</h2><p class="m" id="lm">Reading the document</p><div class="bar"><i id="lbar"></i></div></div></section>

<section class="screen" id="s-q"><div class="card"><div class="top"><span id="qc"></span><span id="tm"></span></div><div class="bar"><i id="qb"></i></div><div id="qa"></div>
<div class="nav"><button class="btn g" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div></div>
<div class="row"><button class="btn g" id="rs">Restart quiz</button></div></section>

<section class="screen card" id="s-res"><div style="text-align:center"><h2>Quiz complete</h2><div class="ring"><svg width="160" height="160"><circle class="bg" cx="80" cy="80" r="70"/><circle class="fg" id="rf" cx="80" cy="80" r="70"/></svg><div id="rp">0%</div></div><p class="m" id="rm"></p></div>
<div class="stats" id="stats"></div>
<div class="row"><button class="btn" id="retry">Retry Quiz</button><button class="btn g" id="newq">Generate New Quiz</button><button class="btn g" id="chs">Change Settings</button><button class="btn g" id="rvb">Review Answers</button></div><div id="rvw" style="margin-top:20px"></div></section>
</main>
<script>
const AIuse=async()=>{const call=async(prompt,o={})=>{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,web:!!o.web,imgs:(o.imgs||[]).map(u=>u.split(',')[1])})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'AI error '+r.status);return d};const f=(p,o)=>call(p,o);f.json=async(p,o)=>{const t=(await call(p,o)).text;return JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1))};return f};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s),L='ABCD';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMGINS=u=>`Attached are images of PDF pages ${u.join(', ')} (in that order). Where a page shows a figure, diagram, photo or part, write some image-based questions (up to about a third of the questions), such as "What is the name of the part shown in the image?" or "What does this diagram represent?". For these, set "img":{"p":page number,"box":[x,y,w,h]} where box is the figure's bounding box as fractions 0-1 of the page (x,y = top-left), drawn tightly around ONLY the figure being asked about and excluding any caption or label that would reveal the answer. The question must need the image to be answered and its answer must be certain from the page text or labels. Never refer to an image you cannot see.`;
const imgTag=q=>`<img class="qi" src="${q.url}" alt="Figure from PDF page ${q.img.p}"><div class="m" style="text-align:center;font-size:12px;margin:-4px 0 8px">Figure from PDF · page ${q.img.p} · tap to enlarge</div>`;
async function pageCanvas(n,w){const pg=await S.pdf.getPage(n),v=pg.getViewport({scale:1}),vp=pg.getViewport({scale:w/v.width}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c}
async function pageJPG(n){return (await pageCanvas(n,900)).toDataURL('image/jpeg',.6)}
async function crop(im){const c=await pageCanvas(im.p,1200);let[x,y,w,h]=Array.isArray(im.box)?im.box.map(Number):[0,0,1,1];if([x,y,w,h].some(v=>!isFinite(v))||w<.08||h<.08){x=0;y=0;w=1;h=1}x=Math.min(Math.max(x,0),.95);y=Math.min(Math.max(y,0),.95);w=Math.min(w,1-x);h=Math.min(h,1-y);const o=document.createElement('canvas');o.width=Math.round(c.width*w);o.height=Math.round(c.height*h);o.getContext('2d').drawImage(c,c.width*x,c.height*y,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/jpeg',.85)}
let S={pdf:null,pages:[],name:'',cfg:{n:10,d:'Mixed',m:'Instant feedback'},qs:[],a:[],i:0,t0:0,end:0,scr:'s-up',tick:null};
function go(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));S.scr=id;$('#gear').hidden=!S.pages.length;window.scrollTo({top:0,behavior:'smooth'})}
function pills(el,opts,key,cb){const g=$(el);g.innerHTML=opts.map(o=>`<button class="pill${String(S.cfg[key])===String(o)?' on':''}" data-v="${o}">${o}</button>`).join('');g.onclick=e=>{const b=e.target.closest('.pill');if(!b)return;S.cfg[key]=key==='n'?+b.dataset.v:b.dataset.v;g.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p===b));if(key==='n')$('#cn').value=''}};
pills('#gn',[5,10,20,30,50],'n');pills('#gd',['Easy','Medium','Hard','Mixed'],'d');pills('#gm',['Instant feedback','Exam mode'],'m');
$('#cn').oninput=e=>{const v=Math.max(1,Math.min(100,+e.target.value||0));if(v){S.cfg.n=v;document.querySelectorAll('#gn .pill').forEach(p=>p.classList.remove('on'))}};
function perr(el,m){const e=$(el);e.textContent=m;e.style.display=m?'block':'none'}
// ---- PDF
$('#upb').onclick=()=>$('#file').click();
const dr=$('#drop');['dragover','dragenter'].forEach(t=>dr.addEventListener(t,e=>{e.preventDefault();dr.classList.add('h')}));['dragleave','drop'].forEach(t=>dr.addEventListener(t,e=>{e.preventDefault();dr.classList.remove('h')}));
dr.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));$('#file').onchange=e=>handle(e.target.files[0]);
async function handle(f){perr('#uerr','');if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name))return perr('#uerr','Please choose a PDF file.');
if(S.scr==='s-q'&&S.a.some(x=>x!=null)&&!confirm('Uploading a new PDF will discard your current quiz. Continue?'))return;
$('#fn').style.display='block';$('#fname').textContent=f.name;$('#fst').textContent='Reading…';$('#fbar').style.width='3%';
try{if(!window.pdfjsLib)throw new Error('The PDF reader could not load. Check your connection.');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,pg=[];
for(let p=1;p<=pdf.numPages;p++){const po=await pdf.getPage(p),t=await po.getTextContent();let im=false;try{const ol=await po.getOperatorList(),O=pdfjsLib.OPS;im=ol.fnArray.some(f=>f===O.paintImageXObject||f===O.paintInlineImageXObject||f===O.paintImageMaskXObject)}catch(_){}pg.push({n:p,im,t:t.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()});$('#fbar').style.width=(5+90*p/pdf.numPages)+'%';$('#fst').textContent=`Page ${p} of ${pdf.numPages}`}
const chars=pg.reduce((a,p)=>a+p.t.length,0);if(chars<300)throw new Error('No readable text found. This PDF may be scanned images; try a text-based PDF.');
S.pdf=pdf;S.pages=pg;S.name=f.name;S.qs=[];$('#fbar').style.width='100%';$('#fst').textContent=`✓ ${pdf.numPages} pages · ${Math.round(chars/1000)}k characters`;
$('#dinfo').textContent=`Source: ${f.name} (${pdf.numPages} pages)`;$('#resume').hidden=true;setTimeout(()=>go('s-set'),700)}
catch(e){$('#fbar').style.width='0';$('#fst').textContent='';perr('#uerr','Could not process this PDF: '+(e.message||e))}}
// ---- AI generation
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function seg(k,B){const P=S.pages,s=Math.floor(k*P.length/B);let o='',i=s,ip=[];while(i<P.length&&o.length<22000){if(P[i].t)o+=`[Page ${P[i].n}] ${P[i].t}\n`;if(P[i].im)ip.push(P[i].n);i++}return{o,ip}}
async function gen(){perr('#gerr','');const sm=await AIuse();if(!sm){perr('#gerr','AI is not available.');return}
const N=S.cfg.n,B=Math.ceil(N/10),qs=[];go('s-load');$('#lt').textContent='Analyzing your PDF…';
try{for(let k=0;k<B;k++){const c=Math.min(10,N-qs.length>0?Math.ceil((N-qs.length)/(B-k)):0);if(c<=0)break;
$('#lm').textContent=`Writing questions ${qs.length+1}–${qs.length+c} of ${N}`;$('#lbar').style.width=(8+88*k/B)+'%';
const sg=seg(k,B),pick=sg.ip.filter((_,i)=>i%Math.max(1,Math.ceil(sg.ip.length/3))===0).slice(0,3),imgs=[],used=[];for(const n of pick){try{imgs.push(await pageJPG(n));used.push(n)}catch(_){}}
const d=S.cfg.d==='Mixed'?'a mix of easy, medium and hard':S.cfg.d.toLowerCase();
const pr=`You are an expert exam writer. Using ONLY the source text below (pages marked [Page n]), write ${c} multiple-choice questions. Difficulty: ${d}. ${$('#pref').value?'Focus: '+$('#pref').value+'.':''}
Rules: test understanding, not sentence copying; exactly 4 options; exactly one correct answer; no ambiguous questions; every correct answer must be directly supported by the text, so skip anything unsupported; never invent facts; vary which option is correct; avoid repeating these earlier questions: ${qs.map(q=>q.q).slice(-25).join(' | ')||'none'}.
Verify each answer against the text before output. Return ONLY a JSON array of objects: {"q":string,"o":[4 strings without letters],"a":index 0-3 of correct option,"p":page number,"t":short topic or section,"s":one-sentence paraphrase of the supporting PDF info,"e":[4 short strings: for each option in order, why it is correct or why it is wrong, based on the text],"img":optional, only for image-based questions}.
${imgs.length?IMGINS(used):''}\nSOURCE:\n${sg.o}`;
let r;try{r=await sm.json(pr,{cache:false,modelTier:'default',imgs})}catch(e){if(e.code==='not_granted')throw new Error('AI access was not granted.');if(k===0)throw e;continue}
(Array.isArray(r)?r:r.questions||[]).forEach(q=>{if(q&&q.q&&Array.isArray(q.o)&&q.o.length===4&&Array.isArray(q.e)&&q.e.length===4&&q.a>=0&&q.a<4&&!qs.some(x=>x.q===q.q)){const ix=shuf([0,1,2,3]);qs.push({q:q.q,o:ix.map(i=>q.o[i]),e:ix.map(i=>q.e[i]),a:ix.indexOf(q.a),p:q.p,t:q.t,s:q.s,img:q.img&&used.includes(+q.img.p)?{p:+q.img.p,box:q.img.box}:null})}})}
if(!qs.length)throw new Error('No questions could be generated from this PDF.');
$('#lm').textContent='Preparing figures…';for(const q of qs){if(q.img){try{q.url=await crop(q.img)}catch(_){q.img=null}}}
S.qs=qs.slice(0,N);S.a=new Array(S.qs.length).fill(null);S.i=0;S.t0=Date.now();S.end=0;$('#lbar').style.width='100%';
if(qs.length<N)alert(`Only ${S.qs.length} questions could be verified from the PDF.`);startQ()}
catch(e){go('s-set');perr('#gerr','Question generation failed: '+(e.message||e.code||e))}}
// ---- Quiz
const exam=()=>S.cfg.m==='Exam mode';
function startQ(){go('s-q');clearInterval(S.tick);S.tick=setInterval(()=>{if(!S.end)$('#tm').textContent='⏱ '+fmt((Date.now()-S.t0)/1000)},1000);renderQ()}
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function fbHTML(q,i,a,rv){const ok=a===q.a;return `<div class="fb ${ok?'ok':'no'}"><h3>${ok?'✓ Correct':'✗ Incorrect'}</h3><p><b>Correct answer:</b> ${L[q.a]}. ${esc(q.o[q.a])}</p>${ok?'':`<p><b>Why ${L[a]} is wrong:</b> ${esc(q.e[a])}</p>`}<p><b>${ok?'Why:':'Why '+L[q.a]+' is right:'}</b> ${esc(q.e[q.a])}</p><p><span class="src pdf">FROM YOUR PDF</span>${q.p?'Page '+esc(q.p)+' · ':''}${esc(q.t||'')}${q.s?' — '+esc(q.s):''}</p><button class="btn g" data-km="${i}" style="margin-top:6px">Know More</button><div class="km" id="km${rv?'r':''}${i}"></div></div>`}
function optsHTML(q,a,lock,reveal){return q.o.map((o,k)=>{let c='';if(reveal&&a!=null){if(k===q.a)c=' ok';else if(k===a)c=' no'}else if(k===a)c=' sel';return `<button class="opt${c}" data-k="${k}" ${lock?'disabled':''}><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join('')}
function renderQ(){const q=S.qs[S.i],a=S.a[S.i],n=S.qs.length,lock=!exam()&&a!=null;
$('#qc').textContent=`Question ${S.i+1} of ${n}`;$('#qb').style.width=(S.i+(a!=null?1:0))/n*100+'%';
$('#qa').innerHTML=`<div class="qt">${esc(q.q)}</div>${q.url?imgTag(q):''}<div id="ops">${optsHTML(q,a,lock,!exam())}</div><div id="fbx">${lock?fbHTML(q,S.i,a):''}</div>`;
$('#prev').disabled=S.i===0;const last=S.i===n-1;$('#next').textContent=last?'Finish quiz':'Next →';$('#next').disabled=a==null;
$('#ops').onclick=e=>{const b=e.target.closest('.opt');if(!b||(!exam()&&S.a[S.i]!=null))return;const k=+b.dataset.k;S.a[S.i]=k;
if(exam()){$('#ops').innerHTML=optsHTML(q,k,false,false);$('#qb').style.width=(S.i+1)/n*100+'%'}else{$('#ops').innerHTML=optsHTML(q,k,true,true);$('#fbx').innerHTML=fbHTML(q,S.i,k);$('#qb').style.width=(S.i+1)/n*100+'%'}$('#next').disabled=false}}
$('#prev').onclick=()=>{S.i--;renderQ()};
$('#next').onclick=()=>{if(S.i<S.qs.length-1){S.i++;renderQ()}else finish()};
$('#rs').onclick=()=>{if(confirm('Restart this quiz? Your answers will be cleared.')){S.a.fill(null);S.i=0;S.t0=Date.now();S.end=0;renderQ()}};
function finish(){S.end=Date.now();clearInterval(S.tick);const n=S.qs.length,c=S.qs.filter((q,i)=>S.a[i]===q.a).length,p=Math.round(c/n*100);go('s-res');
$('#stats').innerHTML=[['Score',`${c}/${n}`],['Correct',c],['Incorrect',n-c],['Percentage',p+'%'],['Difficulty',S.cfg.d],['Time',fmt((S.end-S.t0)/1000)]].map((x,i)=>`<div class="st" style="animation-delay:${i*.07}s"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('#rm').textContent=p>=80?'Excellent work.':p>=50?'Good effort. Review the missed questions.':'Keep practising. Review the answers below.';$('#rvw').innerHTML='';
const f=$('#rf');f.style.strokeDashoffset=440;requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.strokeDashoffset=440*(1-p/100)));let v=0;const t=setInterval(()=>{v=Math.min(p,v+2);$('#rp').textContent=v+'%';if(v>=p)clearInterval(t)},25)}
$('#rvb').onclick=()=>{$('#rvw').innerHTML=S.qs.map((q,i)=>{const a=S.a[i];return `<div class="rv"><div class="qt" style="font-size:17px">${i+1}. ${esc(q.q)}</div>${q.url?imgTag(q):''}${optsHTML(q,a,true,true)}${a==null?'<p class="m">Not answered.</p>':''}${a==null?'':fbHTML(q,i,a,true)}</div>`}).join('');$('#rvw').scrollIntoView({behavior:'smooth'})};
$('#retry').onclick=()=>{S.a.fill(null);S.i=0;S.t0=Date.now();S.end=0;startQ()};
$('#newq').onclick=gen;$('#chs').onclick=()=>go('s-set');
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('qi'))e.target.classList.toggle('z')});
// ---- settings
$('#start').onclick=gen;
$('#gear').onclick=()=>{$('#resume').hidden=!(S.qs.length&&!S.end);go('s-set')};
$('#resume').onclick=()=>go('s-q');
$('#start').addEventListener('click',()=>{});
window.addEventListener('beforeunload',e=>{if(S.scr==='s-q'&&S.a.some(x=>x!=null)&&!S.end){e.preventDefault();e.returnValue=''}});
// ---- Know More
document.addEventListener('click',async e=>{const b=e.target.closest('[data-km]');if(!b)return;const i=+b.dataset.km,q=S.qs[i],box=b.parentElement.querySelector('.km');
box.style.display='block';box.innerHTML='<p class="m">Gathering additional information…</p>';
const gq='https://www.google.com/search?q='+encodeURIComponent(q.t?q.t+' '+q.q:q.q);
const link=`<p><a href="${gq}" target="_blank" rel="noopener">Search Google for this topic ↗</a></p>`;
try{const sm=await AIuse();if(!sm)throw 0;const r=await sm(`A student is studying "${q.t||q.q}". Question: ${q.q}\nCorrect answer: ${q.o[q.a]}\nSearch the web, preferring official, educational, technical or authoritative sources. Explain this concept in more depth (150-220 words), going beyond the textbook. Plain text paragraphs, no markdown. Do not invent facts.`,{cache:false,web:true});
box.innerHTML=`<p><span class="src web">FROM THE WEB · NOT FROM YOUR PDF</span></p>${r.text.split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join('')}${(r.sources||[]).length?'<p><b>Sources:</b></p>'+r.sources.slice(0,5).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)} ↗</a></p>`).join(''):''}<p class="m" style="font-size:13px">Your PDF-based explanation above remains the primary answer.</p>${link}`}
catch(_){box.innerHTML=`<p class="m">Extra explanation is unavailable right now.</p>${link}`}});
</script></body></html>
